global:
  scrape_interval: 5s
  scrape_timeout: 3s
scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ['api-gateway:2000']
  - job_name: user-service
    static_configs:
      - targets: ['user-service:4000']
  - job_name: feed-service
    static_configs:
      - targets: ['feed-service:3000']
