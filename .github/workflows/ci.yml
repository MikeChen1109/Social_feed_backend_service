name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [feed-service, user-service, api-gateway, observability]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24.3

    - name: Install dependencies
      working-directory: ${{ matrix.service }}
      run: go mod download

    - name: Run tests
      working-directory: ${{ matrix.service }}
      run: go test -race ./... -coverprofile=cover.out

  monitoring-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start local stack
        run: make local-up
      - name: Verify API flow
        run: make local-test
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.3
      - name: Verify PostgreSQL cancellation and cursor pagination
        working-directory: feed-service
        env:
          TEST_POSTGRES_DSN: postgres://social:social_local@localhost:5433/social_feed?sslmode=disable
        run: go test -race ./repositories -run TestPostgres
      - name: Verify scrapes and dashboard queries
        run: make monitoring-test
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.local.yml logs --tail=100
      - name: Stop local stack
        if: always()
        run: make local-down
